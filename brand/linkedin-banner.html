<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LinkedIn banner — George Rusu</title>
<meta name="robots" content="noindex" />
<!-- Source of brand/linkedin-banner.png (1584 × 396). The bottom-left corner stays empty: LinkedIn covers it with the profile photo. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  .b { width: 1584px; height: 396px; position: relative; overflow: hidden; background: #08090a; color: #f4f4ee; font-family: "Archivo", Arial, sans-serif; }
  .b::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(200, 255, 46, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(200, 255, 46, .07) 1px, transparent 1px); background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 80% 120% at 70% 40%, #000 20%, transparent 78%); mask-image: radial-gradient(ellipse 80% 120% at 70% 40%, #000 20%, transparent 78%); }
  .in { position: absolute; left: 570px; right: 48px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .tag { font: 500 17px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #9ea3a8; display: flex; align-items: center; gap: 12px; }
  .tag i { width: 10px; height: 10px; border-radius: 50%; background: #c8ff2e; }
  .tag b { color: #c8ff2e; font-weight: 500; }
  h1 { margin: 20px 0 0; font: 900 74px/.9 "Archivo", sans-serif; letter-spacing: -.045em; text-transform: uppercase; }
  h1 em { font-style: normal; color: #c8ff2e; }
  .row { display: flex; gap: 12px; margin-top: 24px; }
  .row span { font: 400 16px/1 "JetBrains Mono", monospace; padding: 11px 16px; border-radius: 999px; border: 1px solid #343a40; background: #101214; color: #f4f4ee; }
  .row span b { color: #c8ff2e; font-weight: 500; }
</style>
</head>
<body>
<div class="b">
  <div class="in">
    <p class="tag"><i></i>AI &amp; Automation Engineer <b>/</b> Founder, FLOWENTIC</p>
    <h1>Agents that <em>show up</em> on Monday.</h1>
    <div class="row">
      <span><b>320+</b> production workflows</span>
      <span>LangGraph · RAG · Voice</span>
      <span>Human in the loop</span>
      <span>B2B</span>
    </div>
  </div>
</div>
</body>
</html>
